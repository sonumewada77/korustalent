
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Korus Talent connects healthcare, IT, non-IT and customer support talent with organizations in India and the United States.">
  <meta name="theme-color" content="#071d35">

  <title>Korus Talent | Talent. Opportunity. Connection.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071d35;
      --navy-light: #103957;
      --blue: #1684d8;
      --cyan: #18b9b1;
      --text: #182538;
      --muted: #68778a;
      --light: #f4f8fb;
      --border: #e4ebf1;
      --white: #fff;
      --shadow: 0 18px 55px rgba(7, 29, 53, .10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.65;
      overflow-x: hidden;
    }

    body, button, input, textarea, select { font-family: "DM Sans", Arial, sans-serif; }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; }
    button { cursor: pointer; }
    .container { width: min(1160px, 91%); margin: auto; }

    .topbar {
      background: var(--navy);
      color: #d9e7f2;
      font-size: 12px;
      padding: 9px 0;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar a { color: white; font-weight: 700; }
    .topbar-right { display: flex; gap: 20px; }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(226,235,241,.9);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Manrope", sans-serif;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--navy);
      white-space: nowrap;
    }

    .logo-mark {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      border-radius: 12px;
      color: white;
      font-size: 19px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      box-shadow: 0 7px 20px rgba(22,132,216,.2);
    }

    .logo span { color: var(--cyan); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 23px;
    }

    .nav-links > a {
      color: #354459;
      font-size: 13px;
      font-weight: 700;
      transition: color .2s;
    }

    .nav-links > a:hover { color: var(--blue); }

    .nav-links .nav-cta {
      color: white;
      background: var(--navy);
      padding: 12px 17px;
      border-radius: 9px;
    }

    .nav-links .nav-cta:hover { background: var(--blue); color: white; }

    .menu-toggle {
      display: none;
      width: 43px;
      height: 43px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      color: var(--navy);
      font-size: 23px;
    }

    /* HERO */

    .hero {
      position: relative;
      color: white;
      padding: 88px 0 80px;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 20%, rgba(24,185,177,.22), transparent 30%),
        linear-gradient(125deg, #061a30, #0b3454 62%, #07525d);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 50%;
      right: -170px;
      top: -250px;
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr .95fr;
      align-items: center;
      gap: 55px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #baf7f0;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--cyan);
    }

    h1, h2, h3, h4 { font-family: "Manrope", sans-serif; }

    .hero h1 {
      font-size: clamp(42px, 5vw, 67px);
      line-height: 1.08;
      letter-spacing: -2.8px;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: #55ded5;
    }

    .hero-copy {
      max-width: 550px;
      color: #ccdae7;
      font-size: 16px;
      margin-bottom: 29px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 19px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      transition: transform .25s, background .25s, box-shadow .25s;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: linear-gradient(135deg, #198ce0, #15b8b0);
      color: white;
      box-shadow: 0 10px 25px rgba(21,184,176,.2);
    }

    .btn-outline {
      border-color: rgba(255,255,255,.32);
      color: white;
      background: rgba(255,255,255,.06);
    }

    .btn-outline:hover { background: white; color: var(--navy); }

    .hero-points {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 30px;
      color: #d2e4ee;
      font-size: 12px;
      font-weight: 600;
    }

    .hero-points span::before {
      content: "✓";
      color: #55ded5;
      margin-right: 7px;
      font-weight: 900;
    }

    .hero-image-wrap {
      position: relative;
      min-width: 0;
    }

    .hero-image {
      height: 440px;
      object-fit: cover;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 30px 70px rgba(0,0,0,.25);
    }

    .hero-image-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(0deg, rgba(4,24,43,.45), transparent 55%);
      pointer-events: none;
    }

    .hero-image-label {
      position: absolute;
      z-index: 2;
      left: 18px;
      right: 18px;
      bottom: 18px;
      padding: 17px 19px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 15px;
      background: rgba(7,29,53,.78);
      backdrop-filter: blur(12px);
    }

    .hero-image-label strong { display: block; font-size: 16px; }
    .hero-image-label span { color: #d0e3ec; font-size: 12px; }

    /* TRUST STRIP */

    .trust-strip {
      padding: 21px 0;
      border-bottom: 1px solid var(--border);
      background: white;
    }

    .trust-items {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .trust-item {
      font-size: 12px;
      font-weight: 700;
      color: #59697b;
    }

    .trust-item span {
      color: var(--cyan);
      font-weight: 900;
      margin-right: 7px;
    }

    /* GENERAL SECTIONS */

    section.section { padding: 88px 0; }

    .section-heading {
      max-width: 720px;
      margin-bottom: 38px;
    }

    .section-kicker {
      color: #079c9b;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .section-heading h2,
    .intro-copy h2 {
      color: var(--navy);
      font-size: clamp(31px, 4vw, 45px);
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 14px;
    }

    .section-heading p,
    .intro-copy p {
      color: var(--muted);
      font-size: 15px;
    }

    .section-heading.center {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .soft { background: var(--light); }

    /* SERVICE CARDS */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 25px;
    }

    .service-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: white;
      transition: transform .3s, box-shadow .3s, border-color .3s;
    }

    .service-card:hover {
      transform: translateY(-7px);
      border-color: #c8e5e7;
      box-shadow: var(--shadow);
    }

    .service-image-wrap {
      position: relative;
      height: 250px;
      overflow: hidden;
      background: #eaf2f6;
    }

    .service-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .65s;
    }

    .service-card:hover .service-image { transform: scale(1.055); }

    .image-tag {
      position: absolute;
      left: 17px;
      top: 17px;
      padding: 7px 11px;
      color: var(--navy);
      background: rgba(255,255,255,.94);
      border-radius: 30px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .service-content { padding: 25px 27px 28px; }

    .service-content h3 {
      color: var(--navy);
      font-size: 22px;
      margin-bottom: 9px;
    }

    .service-content p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .service-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #087dbb;
      font-size: 13px;
      font-weight: 900;
    }

    .service-link span { transition: transform .2s; }
    .service-link:hover span { transform: translateX(5px); }

    /* TWO MARKETS */

    .market-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .market-card {
      display: flex;
      gap: 20px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: white;
      transition: transform .25s, box-shadow .25s;
    }

    .market-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .market-icon {
      flex: 0 0 53px;
      width: 53px;
      height: 53px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #087dbb;
      background: #e7f5f8;
      font-size: 24px;
    }

    .market-card h3 { color: var(--navy); font-size: 20px; margin-bottom: 8px; }
    .market-card p { color: var(--muted); font-size: 14px; margin-bottom: 13px; }

    /* PROCESS */

    .process-section {
      color: white;
      background: linear-gradient(120deg, #071d35, #0b3d57);
    }

    .process-section .section-heading h2 { color: white; }
    .process-section .section-heading p { color: #c3d4e0; }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 17px;
    }

    .process-card {
      padding: 25px;
      min-height: 205px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 15px;
      background: rgba(255,255,255,.055);
      transition: background .25s, transform .25s;
    }

    .process-card:hover {
      background: rgba(255,255,255,.10);
      transform: translateY(-5px);
    }

    .process-number {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: white;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .process-card h3 { font-size: 17px; margin-bottom: 8px; }
    .process-card p { color: #c0d1dd; font-size: 13px; }

    /* CONTACT */

    .contact-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 45px;
      align-items: start;
    }

    .contact-info {
      padding: 31px;
      border-radius: 20px;
      color: white;
      background: linear-gradient(145deg, #071d35, #0b4b60);
    }

    .contact-info h2 {
      font-size: 31px;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .contact-info > p {
      color: #c7d9e4;
      font-size: 14px;
      margin-bottom: 27px;
    }

    .contact-line {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      margin-top: 19px;
    }

    .contact-line .symbol {
      display: grid;
      place-items: center;
      flex: 0 0 39px;
      width: 39px;
      height: 39px;
      border-radius: 11px;
      background: rgba(255,255,255,.12);
    }

    .contact-line small {
      display: block;
      color: #b6cbd9;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .contact-line a { font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
    .contact-line a:hover { color: #70e3dc; }

    .contact-form {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 35px rgba(7,29,53,.045);
    }

    .contact-form h3 { color: var(--navy); font-size: 23px; margin-bottom: 5px; }
    .form-intro { color: var(--muted); font-size: 13px; margin-bottom: 23px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { grid-column: 1 / -1; }

    .field label { color: #344054; font-size: 12px; font-weight: 800; }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #dce5ec;
      border-radius: 9px;
      background: #fbfdfe;
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22,132,216,.10);
    }

    .field textarea { min-height: 105px; resize: vertical; }
    .contact-form .btn { width: 100%; margin-top: 19px; border: 0; }

    .form-note { color: var(--muted); font-size: 11px; margin-top: 11px; }

    /* FINAL CTA & FOOTER */

    .final-cta { padding: 15px 0 85px; }

    .cta-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding: 37px 40px;
      border-radius: 20px;
      color: white;
      background: linear-gradient(115deg, #0b3151, #087d87);
    }

    .cta-box h2 { font-size: clamp(25px, 3vw, 34px); line-height: 1.2; margin-bottom: 8px; }
    .cta-box p { color: #d1e6ed; font-size: 14px; }

    .cta-box .btn { background: white; color: var(--navy); white-space: nowrap; }

    footer {
      background: #061729;
      color: #c5d3df;
      padding: 48px 0 20px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 45px;
      padding-bottom: 35px;
    }

    .footer-brand .logo { color: white; margin-bottom: 16px; }
    .footer-brand p { max-width: 350px; color: #aebfce; font-size: 13px; }

    .footer-col h4 { color: white; font-size: 14px; margin-bottom: 15px; }
    .footer-col a {
      display: block;
      width: fit-content;
      margin: 9px 0;
      color: #b9c9d6;
      font-size: 13px;
    }

    .footer-col a:hover { color: #62ddd6; }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.12);
      color: #9eb1c1;
      font-size: 11px;
    }

    /* FLOATING WHATSAPP */

    .whatsapp-float {
      position: fixed;
      z-index: 1200;
      right: 22px;
      bottom: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 58px;
      height: 58px;
      padding: 0 17px;
      border-radius: 40px;
      color: white;
      background: #25d366;
      box-shadow: 0 9px 28px rgba(0,0,0,.22);
      font-size: 14px;
      font-weight: 900;
      transition: transform .2s, box-shadow .2s;
    }

    .whatsapp-float:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 14px 35px rgba(37,211,102,.35);
    }

    .whatsapp-icon { font-size: 24px; line-height: 1; }

    /* SCROLL REVEAL */

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .delay-1 { transition-delay: .10s; }
    .delay-2 { transition-delay: .20s; }
    .delay-3 { transition-delay: .30s; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
    }

    /* RESPONSIVE */

    @media (max-width: 980px) {
      .nav-links { gap: 14px; }
      .nav-links > a { font-size: 12px; }
      .hero-grid { gap: 32px; }
      .hero-image { height: 390px; }
      .process-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 760px) {
      .topbar-inner { justify-content: center; text-align: center; }
      .topbar-right { display: none; }

      .nav { min-height: 68px; }
      .menu-toggle { display: block; }

      .nav-links {
        display: none;
        position: absolute;
        top: 68px;
        left: 0;
        right: 0;
        padding: 13px 5% 20px;
        background: white;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 15px 30px rgba(7,29,53,.08);
      }

      .nav-links.open { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
      .nav-links > a { padding: 12px 4px; font-size: 14px; }
      .nav-links .nav-cta { text-align: center; margin-top: 7px; }

      .hero { padding: 62px 0 55px; }
      .hero-grid { grid-template-columns: 1fr; gap: 32px; }
      .hero h1 { font-size: clamp(40px, 10vw, 58px); letter-spacing: -2px; }
      .hero-copy { font-size: 15px; }
      .hero-image { height: 330px; }
      .hero-image-wrap { max-width: 560px; width: 100%; margin: auto; }

      section.section { padding: 65px 0; }
      .services-grid, .market-grid, .contact-grid { grid-template-columns: 1fr; }
      .service-image-wrap { height: 235px; }
      .contact-grid { gap: 24px; }
      .contact-info, .contact-form { padding: 25px; }
      .cta-box { padding: 29px 25px; flex-direction: column; align-items: flex-start; }
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 30px; }
      .footer-brand { grid-column: 1 / -1; }
    }

    @media (max-width: 480px) {
      .logo { font-size: 20px; }
      .logo-mark { width: 35px; height: 35px; }
      .hero-actions .btn { width: 100%; }
      .hero-points { gap: 10px 15px; }
      .hero-image { height: 285px; }
      .services-grid { gap: 18px; }
      .service-content { padding: 21px; }
      .service-image-wrap { height: 205px; }
      .market-card { padding: 21px; gap: 14px; }
      .market-icon { flex-basis: 44px; width: 44px; height: 44px; }
      .process-grid { grid-template-columns: 1fr; }
      .process-card { min-height: auto; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .footer-grid { grid-template-columns: 1fr; }
      .footer-brand { grid-column: auto; }
      .whatsapp-float { right: 14px; bottom: 15px; height: 54px; min-width: 54px; padding: 0 15px; }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="c
